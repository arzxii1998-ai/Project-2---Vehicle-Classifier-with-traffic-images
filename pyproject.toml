[project]
name = "vehicle-classifier"
version = "0.1.0"
description = "Vehicle classification from traffic images using deep learning"
readme = "README.md"
authors = [
    { name = "AliReza", email = "arzxii1998@Gmail.com" }
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "imagehash>=4.3.2",
    "matplotlib>=3.11.2",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
]

[project.scripts]
vehicle-classifier = "vehicle_classifier:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
