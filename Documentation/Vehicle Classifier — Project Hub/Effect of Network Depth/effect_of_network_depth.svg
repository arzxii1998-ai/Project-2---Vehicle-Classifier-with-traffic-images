<rect class="box" x="123" y="61" width="13" height="7" rx="1"/><text x="129.5" y="65.3">GAP</text>
<rect class="box" x="139" y="61" width="24" height="7" rx="1"/><text x="151" y="65.3">Classifier</text>
</g>
<path class="arr" d="M40,64.5 L43,64.5"/><path class="arr" d="M56,64.5 L59,64.5"/><path class="arr" d="M72,64.5 L75,64.5"/><path class="arr" d="M88,64.5 L91,64.5"/><path class="arr" d="M104,64.5 L107,64.5"/><path class="arr" d="M120,64.5 L123,64.5"/><path class="arr" d="M136,64.5 L139,64.5"/>
<!-- 5 row -->
<g font-size="2.45" text-anchor="middle">
<rect class="box" x="27" y="79" width="13" height="7" rx="1"/><text x="33.5" y="83.3">Input</text>
<rect class="box" x="43" y="79" width="13" height="7" rx="1"/><text x="49.5" y="83.3">Conv 32</text>
<rect class="box" x="59" y="79" width="13" height="7" rx="1"/><text x="65.5" y="83.3">Conv 64</text>
<rect class="box" x="75" y="79" width="13" height="7" rx="1"/><text x="81.5" y="83.3">Conv 128</text>
<rect class="box" x="91" y="79" width="13" height="7" rx="1"/><text x="97.5" y="83.3">Conv 256</text>
<rect class="hi" x="107" y="79" width="13" height="7" rx="1"/><text x="113.5" y="83.3" fill="white">Conv 256</text>
<rect class="map" x="123" y="79" width="13" height="7" rx="1"/><text x="129.5" y="83.3">9 × 7</text>
<rect class="box" x="139" y="79" width="24" height="7" rx="1"/><text x="151" y="83.3">GAP → classifier</text>
</g>
<path class="arr" d="M40,82.5 L43,82.5"/><path class="arr" d="M56,82.5 L59,82.5"/><path class="arr" d="M72,82.5 L75,82.5"/><path class="arr" d="M88,82.5 L91,82.5"/><path class="arr" d="M104,82.5 L107,82.5"/><path class="arr" d="M120,82.5 L123,82.5"/><path class="arr" d="M136,82.5 L139,82.5"/>
<text x="113.5" y="77" font-size="2.6" text-anchor="middle" class="teal" font-weight="700">Added block</text>
<path d="M113.5,77.4 L113.5,76" stroke="#1F6F5F" stroke-width=".45"/>
<text x="8" y="92" font-size="2.7" class="sec">Parameters: 390,952 → 981,288 (2.5×)</text>
<text x="89" y="92" font-size="2.8" font-weight="700">More capacity + larger effective receptive field</text>
<text x="168" y="92" font-size="2.45" text-anchor="end" class="sec">Capacity and receptive-field effects are not isolated.</text>
<text x="89" y="101" font-size="2.4" text-anchor="middle" class="sec">CE · AdamW (lr 1e−3) · augmentation · 30 epochs · seed 42</text>
</svg>
