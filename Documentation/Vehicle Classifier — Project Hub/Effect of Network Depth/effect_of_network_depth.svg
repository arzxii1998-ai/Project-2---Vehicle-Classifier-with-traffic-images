<svg xmlns="http://www.w3.org/2000/svg" width="178mm" height="105mm" viewBox="0 0 178 105">
<rect width="178" height="105" fill="white"/>
<style>
 text{font-family:Arial,Helvetica,sans-serif;fill:#171717} .sec{fill:#5E6462}.teal{fill:#1F6F5F}.neu{fill:#8A908D}
 .box{fill:#fff;stroke:#E4E7E5;stroke-width:.5}.hi{fill:#1F6F5F;stroke:#1F6F5F}.map{fill:#F2F4F3;stroke:#E4E7E5;stroke-width:.5}
 .arr{stroke:#5E6462;stroke-width:.5;fill:none;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 z" fill="#5E6462"/></marker></defs>
<!-- Panel A -->
<text x="8" y="9" font-size="3.7" font-weight="700">Increasing network depth substantially improves validation performance</text>
<line x1="10" y1="39" x2="168" y2="39" stroke="#E4E7E5" stroke-width=".4"/>
<line x1="10" y1="30" x2="168" y2="30" stroke="#E4E7E5" stroke-width=".3"/>
<line x1="10" y1="21" x2="168" y2="21" stroke="#E4E7E5" stroke-width=".3"/>
<line x1="10" y1="12" x2="168" y2="12" stroke="#E4E7E5" stroke-width=".3"/>
<line x1="10" y1="39" x2="10" y2="12" stroke="#5E6462" stroke-width=".5"/>
<text x="5" y="40" font-size="2.5" class="sec">0</text><text x="5" y="31" font-size="2.5" class="sec">20</text><text x="5" y="22" font-size="2.5" class="sec">40</text><text x="5" y="13" font-size="2.5" class="sec">60</text>
<!-- bars, scale 0-100 mapped 39 to -6; visible max 42? Use baseline 39, top = 39 - value*.27 -->
<!-- Accuracy -->
<rect x="25" y="16.73" width="7" height="22.27" fill="#8A908D"/><rect x="33" y="13.85" width="7" height="25.15" fill="#1F6F5F"/>
<!-- F1 -->
<rect x="77" y="16.89" width="7" height="22.11" fill="#8A908D"/><rect x="85" y="14.00" width="7" height="25" fill="#1F6F5F"/>
<!-- Recall -->
<rect x="129" y="16.30" width="7" height="22.70" fill="#8A908D"/><rect x="137" y="14.11" width="7" height="24.89" fill="#1F6F5F"/>
<text x="28.5" y="15.8" font-size="2.5" text-anchor="middle">82.5</text><text x="36.5" y="13" font-size="2.5" text-anchor="middle">93.3</text>
<text x="80.5" y="16" font-size="2.5" text-anchor="middle">81.9</text><text x="88.5" y="13.2" font-size="2.5" text-anchor="middle">92.6</text>
<text x="132.5" y="15.4" font-size="2.5" text-anchor="middle">84.1</text><text x="140.5" y="13.3" font-size="2.5" text-anchor="middle">92.2</text>
<text x="32.5" y="43" font-size="2.8" text-anchor="middle">Accuracy</text><text x="84.5" y="43" font-size="2.8" text-anchor="middle">Macro-F1</text><text x="136.5" y="43" font-size="2.8" text-anchor="middle">Macro-Recall</text>
<rect x="10" y="46" width="4" height="2.5" fill="#8A908D"/><text x="15.5" y="48.2" font-size="2.5">4 blocks</text><rect x="32" y="46" width="4" height="2.5" fill="#1F6F5F"/><text x="37.5" y="48.2" font-size="2.5">5 blocks</text>
<text x="168" y="13" font-size="3.1" text-anchor="end" class="teal" font-weight="700">+10.77 pp accuracy</text>
<!-- Panel B -->
<text x="8" y="57" font-size="3.7" font-weight="700">The fifth block increases capacity and changes the final feature-map scale</text>
<text x="8" y="64" font-size="3" font-weight="700">4-block model</text>
<text x="8" y="82" font-size="3" font-weight="700">5-block model</text>
<!-- 4 row -->
<g font-size="2.45" text-anchor="middle">
<rect class="box" x="27" y="61" width="13" height="7" rx="1"/><text x="33.5" y="65.3">Input</text>
<rect class="box" x="43" y="61" width="13" height="7" rx="1"/><text x="49.5" y="65.3">Conv 32</text>
<rect class="box" x="59" y="61" width="13" height="7" rx="1"/><text x="65.5" y="65.3">Conv 64</text>
<rect class="box" x="75" y="61" width="13" height="7" rx="1"/><text x="81.5" y="65.3">Conv 128</text>
